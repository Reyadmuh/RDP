name: Check Linux Runner for 4 vCPU and 16 GiB RAM

on:
  workflow_dispatch:

jobs:
  check-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Whether 4 vCPU and 16 GiB RAM Are Feasible
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "HOST CPU"
          echo "======================================"
          CPU_COUNT="$(nproc)"
          lscpu | grep -E '^(CPU\(s\):|Model name:|Thread\(s\) per core:|Core\(s\) per socket:|Socket\(s\):)' || true
          echo "Available logical CPUs: ${CPU_COUNT}"

          echo
          echo "======================================"
          echo "HOST MEMORY"
          echo "======================================"
          free -h
          AVAILABLE_KIB="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          AVAILABLE_GIB="$(awk -v kib="${AVAILABLE_KIB}" 'BEGIN {printf "%.2f", kib/1024/1024}')"
          echo "Currently available memory: ${AVAILABLE_GIB} GiB"

          echo
          echo "======================================"
          echo "FEASIBILITY RESULT"
          echo "======================================"

          if [ "${CPU_COUNT}" -lt 4 ]; then
            echo "RESULT: Fewer than 4 logical CPUs are available; a 4-vCPU VM cannot be guaranteed."
          else
            echo "RESULT: Host exposes at least 4 logical CPUs."
          fi

          # Leave at least 2 GiB for the host OS and QEMU overhead.
          REQUIRED_KIB=$((16 * 1024 * 1024))
          SAFE_REQUIRED_KIB=$((18 * 1024 * 1024))
          if [ "${AVAILABLE_KIB}" -lt "${SAFE_REQUIRED_KIB}" ]; then
            echo "RESULT: Not enough currently available RAM to safely allocate 16 GiB to a VM while leaving 2 GiB for the host."
            echo "RECOMMENDATION: Use a host with more RAM, or reduce the guest allocation (for example, to 10-12 GiB)."
          else
            echo "RESULT: Available memory appears sufficient for a 16-GiB guest allocation plus a 2-GiB host reserve."
          fi

          echo
          echo "NOTE: This workflow only checks host resources. It does not create or boot a Windows VM."
