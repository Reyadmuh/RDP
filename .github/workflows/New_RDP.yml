name: Windows Server 2025 QEMU Lab

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: "Direct HTTPS download URL for the official Windows Server 2025 Evaluation ISO"
        required: true
        type: string
        default: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26100.1742.240906-0331.ge_release_svc_refresh_SERVER_EVAL_x64FRE_en-us.iso"

jobs:
  windows-vm:
    runs-on: ubuntu-latest
    # GitHub-hosted runners normally have limited memory; this workflow reserves
    # 16 GiB for the guest; this may exceed available runner memory and can fail.
    timeout-minutes: 350

    steps:
      - name: Generate strong Windows Administrator credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(python3 - <<'PY'
          import secrets, string
          alphabet = string.ascii_letters + string.digits + "!@#$%^&*()-_=+"
          while True:
              value = ''.join(secrets.choice(alphabet) for _ in range(28))
              if (any(c.islower() for c in value)
                  and any(c.isupper() for c in value)
                  and any(c.isdigit() for c in value)
                  and any(c in "!@#$%^&*()-_=+" for c in value)):
                  print(value)
                  break
          PY
          )"
          echo "admin_password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "A new 28-character complex Administrator password was generated for this run."
          # Deliberately do not mask this generated password: it is displayed in the
          # private Actions run summary below, as requested. Restrict repository access.

      - name: Check host resources
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Host CPU ==="
          nproc
          lscpu | grep -E '^(CPU\\(s\\):|Model name:)' || true
          echo "=== Host memory ==="
          free -h
          AVAILABLE_KIB="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          AVAILABLE_GIB="$(awk -v k="$AVAILABLE_KIB" 'BEGIN {printf "%.2f", k/1024/1024}')"
          echo "Available RAM: ${AVAILABLE_GIB} GiB"
          if [ "$AVAILABLE_KIB" -lt $((14 * 1024 * 1024)) ]; then
            echo "::warning::Host has less than 14 GiB available. A Windows Server VM may fail or be very slow."
          fi

      - name: Install QEMU and tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage curl wget unzip jq
          qemu-system-x86_64 --version
          if [ -e /dev/kvm ]; then
            echo "KVM is available."
          else
            echo "::warning::/dev/kvm is unavailable; Windows setup may be extremely slow under software emulation."
          fi

      - name: Download Windows Server 2025 Evaluation ISO
        shell: bash
        env:
          WINDOWS_ISO_URL: ${{ inputs.windows_iso_url }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/windows-lab"
          cd "$HOME/windows-lab"
          case "$WINDOWS_ISO_URL" in
            https://*) ;;
            *) echo "::error::Only HTTPS ISO URLs are accepted."; exit 1 ;;
          esac
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 7200 \
            -o windows-server-2025.iso "$WINDOWS_ISO_URL"
          if [ "$(stat -c%s windows-server-2025.iso)" -lt 3000000000 ]; then
            echo "::error::Downloaded file is unexpectedly small; the URL may not point to the ISO."
            exit 1
          fi
          file windows-server-2025.iso || true
          ls -lh windows-server-2025.iso

      - name: Create Windows virtual disk and unattended answer media
        shell: bash
        env:
          VM_ADMIN_PASSWORD: ${{ steps.credentials.outputs.admin_password }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          cd "$HOME/windows-lab"
          if [ -z "${VM_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Generated Administrator password is missing."
            exit 1
          fi
          if [ -z "${TAILSCALE_AUTH_KEY:-}" ]; then
            echo "::error::Add a repository Actions secret named TAILSCALE_AUTH_KEY."
            exit 1
          fi
          if [ "${#VM_ADMIN_PASSWORD}" -lt 20 ]; then
            echo "::error::Generated Administrator password is too short."
            exit 1
          fi

          qemu-img create -f qcow2 windows-server-2025.qcow2 200G

          # Escape XML-special characters in the secret before inserting it.
          export XML_PASSWORD XML_TAILSCALE_KEY
          XML_PASSWORD="$(python3 - <<'PY'
          import html, os
          print(html.escape(os.environ["VM_ADMIN_PASSWORD"], quote=True))
          PY
          )"
          XML_TAILSCALE_KEY="$(python3 - <<'PY'
          import html, os
          print(html.escape(os.environ["TAILSCALE_AUTH_KEY"], quote=True))
          PY
          )"

          mkdir -p answer-media
          cat > answer-media/autounattend.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <settings pass="windowsPE">
              <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                <InputLocale>en-US</InputLocale><SystemLocale>en-US</SystemLocale><UILanguage>en-US</UILanguage><UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <DiskConfiguration>
                  <Disk wcm:action="add"><DiskID>0</DiskID><WillWipeDisk>true</WillWipeDisk>
                    <CreatePartitions>
                      <CreatePartition wcm:action="add"><Order>1</Order><Type>Primary</Type><Size>500</Size></CreatePartition>
                      <CreatePartition wcm:action="add"><Order>2</Order><Type>Primary</Type><Extend>true</Extend></CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add"><Order>1</Order><PartitionID>1</PartitionID><Format>NTFS</Format><Label>System</Label><Active>true</Active></ModifyPartition>
                      <ModifyPartition wcm:action="add"><Order>2</Order><PartitionID>2</PartitionID><Format>NTFS</Format><Label>Windows</Label></ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                  <WillShowUI>OnError</WillShowUI>
                </DiskConfiguration>
                <ImageInstall><OSImage><InstallTo><DiskID>0</DiskID><PartitionID>2</PartitionID></InstallTo></OSImage></ImageInstall>
                <UserData><AcceptEula>true</AcceptEula><FullName>Lab Administrator</FullName><Organization>Lab</Organization></UserData>
              </component>
            </settings>
            <settings pass="specialize">
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <ComputerName>WS2025-LAB</ComputerName><TimeZone>UTC</TimeZone>
              </component>
            </settings>
            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <InputLocale>en-US</InputLocale><SystemLocale>en-US</SystemLocale><UILanguage>en-US</UILanguage><UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                <OOBE><HideEULAPage>true</HideEULAPage><HideLocalAccountScreen>true</HideLocalAccountScreen><HideOnlineAccountScreens>true</HideOnlineAccountScreens><NetworkLocation>Work</NetworkLocation><ProtectYourPC>3</ProtectYourPC></OOBE>
                <UserAccounts><AdministratorPassword><Value>__ADMIN_PASSWORD__</Value><PlainText>true</PlainText></AdministratorPassword></UserAccounts>
                <AutoLogon><Password><Value>__ADMIN_PASSWORD__</Value><PlainText>true</PlainText></Password><Enabled>true</Enabled><LogonCount>1</LogonCount><Username>Administrator</Username></AutoLogon>
                <FirstLogonCommands>
                  <SynchronousCommand wcm:action="add"><Order>1</Order><Description>Enable RDP and configure firewall</Description><CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0; Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'; Set-Service TermService -StartupType Automatic"</CommandLine><RequiresUserInput>false</RequiresUserInput></SynchronousCommand>
                  <SynchronousCommand wcm:action="add"><Order>2</Order><Description>Run Tailscale bootstrap from ANSWER media</Description><CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$deadline=(Get-Date).AddMinutes(10); do { $v=Get-Volume -FileSystemLabel ANSWER -ErrorAction SilentlyContinue | Select-Object -First 1; if($v -and $v.DriveLetter -and (Test-Path ($v.DriveLetter+':\\Setup-Tailscale.ps1'))){ &amp; powershell.exe -NoProfile -ExecutionPolicy Bypass -File ($v.DriveLetter+':\\Setup-Tailscale.ps1'); exit $LASTEXITCODE }; Start-Sleep -Seconds 5 } while((Get-Date) -lt $deadline); throw 'ANSWER media Setup-Tailscale.ps1 was not found'"</CommandLine><RequiresUserInput>false</RequiresUserInput></SynchronousCommand>
                </FirstLogonCommands>
              </component>
            </settings>
          </unattend>
          XML

          # Substitute the secret without logging it.
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("answer-media/autounattend.xml")
          s = p.read_text()
          s = s.replace("__ADMIN_PASSWORD__", os.environ["XML_PASSWORD"])
          s = s.replace("__TAILSCALE_AUTH_KEY__", os.environ["XML_TAILSCALE_KEY"])
          p.write_text(s)
          PY
          # SetupComplete runs as LocalSystem after Windows setup, without relying
          # on an interactive first logon / FirstLogonCommands.
          mkdir -p 'answer-media/$OEM$/$$/Setup/Scripts'
          cat > 'answer-media/$OEM$/$$/Setup/Scripts/SetupComplete.cmd' <<'CMD'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%WINDIR%\Setup\Scripts\Setup-Tailscale.ps1"
          exit /b 0
          CMD

          cat > 'answer-media/$OEM$/$$/Setup/Scripts/Setup-Tailscale.ps1' <<'PS1'
          $ErrorActionPreference = 'Stop'
          $Log = 'C:\Windows\Temp\windows-vm-bootstrap.log'
          Start-Transcript -Path $Log -Append
          try {
              # Ensure RDP is enabled even if OOBE first-logon commands were skipped.
              Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
              Set-Service TermService -StartupType Automatic
              Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue

              $Installer = Join-Path $env:TEMP 'tailscale-setup.exe'
              $Downloaded = $false
              for ($Attempt = 1; $Attempt -le 8 -and -not $Downloaded; $Attempt++) {
                  try {
                      Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $Installer -UseBasicParsing
                      $Downloaded = $true
                  } catch {
                      Write-Output "Tailscale download attempt $Attempt failed: $_"
                      Start-Sleep -Seconds 15
                  }
              }
              if (-not $Downloaded) { throw 'Unable to download Tailscale installer after 8 attempts.' }

              $Install = Start-Process -FilePath $Installer -ArgumentList '/quiet' -Wait -PassThru
              Write-Output "Tailscale installer exit code: $($Install.ExitCode)"
              $Tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
              for ($Attempt = 1; $Attempt -le 180 -and -not (Test-Path $Tailscale); $Attempt++) {
                  Start-Sleep -Seconds 2
              }
              if (-not (Test-Path $Tailscale)) { throw 'tailscale.exe was not installed.' }

              Set-Service -Name Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
              Start-Service -Name Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 8
              $AuthKey = '__TAILSCALE_AUTH_KEY__'
              & $Tailscale up "--authkey=$AuthKey" "--hostname=ws2025-gh-${{ github.run_id }}" '--unattended' '--accept-routes=false'
              if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE" }

              Start-Sleep -Seconds 5
              & $Tailscale status
              & $Tailscale ip -4
              Write-Output 'Windows VM bootstrap and Tailscale registration completed.'
          } catch {
              Write-Output "BOOTSTRAP ERROR: $_"
              exit 1
          } finally {
              Stop-Transcript
          }
          PS1

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('answer-media/$OEM$/$$/Setup/Scripts/Setup-Tailscale.ps1')
          data = p.read_text()
          data = data.replace('__TAILSCALE_AUTH_KEY__', os.environ['TAILSCALE_AUTH_KEY'])
          p.write_text(data)
          Path('answer-media/Setup-Tailscale.ps1').write_text(data)
          PY

          genisoimage -quiet -o answer.iso -V ANSWER -J -r answer-media
          chmod 600 answer.iso windows-server-2025.qcow2

      - name: Start Windows Server VM
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/windows-lab"

          # GitHub-hosted runners may expose /dev/kvm without granting this job
          # permission to use it. Force software emulation to avoid KVM permission errors.
          CPU="max"

          # Keep the requested 16 GiB guest RAM and 4 vCPUs.
          # Use an IDE disk so Windows Setup can see it without VirtIO drivers.
          # Boot from the ISO once, then boot from the installed virtual disk.
          nohup qemu-system-x86_64 \
            -name windows-server-2025 \
            -machine pc \
            -accel tcg,thread=multi \
            -cpu "$CPU" \
            -smp 4 \
            -m 16384 \
            -drive file=windows-server-2025.qcow2,if=ide,format=qcow2 \
            -cdrom windows-server-2025.iso \
            -drive file=answer.iso,media=cdrom,readonly=on \
            -boot order=c,once=d \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:13389-:3389 \
            -device e1000,netdev=net0 \
            -vga std \
            -display none \
            -serial file:windows-serial.log \
            -monitor none \
            > qemu.log 2>&1 &
          echo $! > qemu.pid
          touch windows-serial.log qemu.log
          echo "QEMU started with PID $(cat qemu.pid)."
          echo "Acceleration: TCG software emulation (slower than KVM)."
          echo "Guest memory requested: 16384 MiB; guest CPUs: 4."
          echo "RDP is forwarded to runner localhost:13389 and the guest is intended to join Tailscale after first logon."

      - name: Wait for Windows setup process
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/windows-lab"
          echo "Waiting for Windows VM to remain running while SetupComplete configures the guest..."
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "::error::QEMU exited during Windows setup."
              tail -n 160 qemu.log || true
              tail -n 160 windows-serial.log || true
              exit 1
            fi
            sleep 60
            echo "Windows VM is still running ($i/30 minutes)."
          done
          echo "Initial VM wait completed. Guest readiness will be verified by Tailscale registration."

      - name: Publish RDP connection details
        id: connection
        shell: bash
        env:
          RUNNER_TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          VM_HOSTNAME: ws2025-gh-${{ github.run_id }}
          ADMIN_PASSWORD: ${{ steps.credentials.outputs.admin_password }}
          WINDOWS_ISO_URL: ${{ inputs.windows_iso_url }}
        run: |
          set -euo pipefail

          # Publish credentials and the ISO link immediately, even if guest Tailscale
          # registration is delayed. The guest IP is appended after discovery.
          {
            echo "# Windows Server 2025 — RDP connection details"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| VM status | QEMU running; checking Tailscale registration |"
            echo "| Tailscale IP | Waiting for Windows guest |"
            echo "| RDP address | Will be shown when guest IP is discovered |"
            echo "| RDP username | \`Administrator\` |"
            echo "| RDP password | \`$ADMIN_PASSWORD\` |"
            echo ""
            echo "## Windows Server 2025 Evaluation ISO"
            echo "[Download Windows Server 2025 ISO (Microsoft)]($WINDOWS_ISO_URL)"
            echo ""
            echo "## Connect"
            echo "When the Tailscale IP appears, connect with: \`mstsc /v:<TAILSCALE-IP>\`"
            echo ""
            echo "Keep this GitHub Actions job running while using the VM. The VM is temporary and is removed when the job ends."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RDP username : Administrator"
          echo "RDP password : $ADMIN_PASSWORD"
          echo "Windows ISO  : $WINDOWS_ISO_URL"

          if [ -z "${RUNNER_TAILSCALE_AUTH_KEY:-}" ]; then
            echo "::warning::TAILSCALE_AUTH_KEY is empty; username/password and ISO link are shown, but guest IP cannot be discovered."
            exit 0
          fi

          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          sudo tailscale up --authkey="$RUNNER_TAILSCALE_AUTH_KEY" \
            --hostname="gh-runner-${GITHUB_RUN_ID}" --accept-routes=false

          echo "Runner Tailscale IP:"
          sudo tailscale ip -4 || true
          echo "Waiting for Windows guest '$VM_HOSTNAME' to appear in Tailscale..."

          VM_TAILSCALE_IP=""
          for i in $(seq 1 180); do
            VM_TAILSCALE_IP="$(sudo tailscale status --json | jq -r --arg host "$VM_HOSTNAME" '
              .Peer[]?
              | select((.HostName // .DNSName // "") | sub("\\.$"; "") == $host)
              | .TailscaleIPs[0] // empty
            ' | head -n 1)"
            if [ -n "$VM_TAILSCALE_IP" ]; then break; fi
            sleep 10
          done

          if [ -z "$VM_TAILSCALE_IP" ]; then
            {
              echo ""
              echo "## Tailscale IP status"
              echo "**Not detected yet.** The Windows guest has not registered in Tailscale."
              echo ""
              echo "Runner Tailscale status:"
              echo '```text'
              sudo tailscale status || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Windows guest did not appear in Tailscale. Username and password are available in the Summary; IP is not available yet."
            sudo tailscale status || true
            exit 0
          fi

          RDP_ADDRESS="$VM_TAILSCALE_IP:3389"
          {
            echo ""
            echo "## Tailscale connection"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| VM status | **Running and visible in Tailscale** |"
            echo "| Tailscale IP | \`$VM_TAILSCALE_IP\` |"
            echo "| RDP address | \`$RDP_ADDRESS\` |"
            echo "| RDP username | \`Administrator\` |"
            echo "| RDP password | \`$ADMIN_PASSWORD\` |"
            echo ""
            echo "Run on your Windows PC: \`mstsc /v:$VM_TAILSCALE_IP\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=============================================="
          echo "WINDOWS SERVER 2025 RDP CONNECTION"
          echo "Tailscale IP : $VM_TAILSCALE_IP"
          echo "RDP address  : $RDP_ADDRESS"
          echo "Username     : Administrator"
          echo "Password     : $ADMIN_PASSWORD"
          echo "=============================================="

      - name: Keep VM alive
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/windows-lab"
          echo "Windows Server 2025 QEMU VM is running; keep this job active to keep the VM alive."
          while kill -0 "$(cat qemu.pid)" 2>/dev/null; do
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] VM is running."
            sleep 300
          done

      - name: Upload diagnostic logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-server-2025-qemu-logs
          path: |
            /home/runner/windows-lab/qemu.log
            /home/runner/windows-lab/windows-serial.log
            /home/runner/windows-lab/answer-media/$OEM$/$$/Setup/Scripts/Setup-Tailscale.ps1
          if-no-files-found: ignore
          retention-days: 3
