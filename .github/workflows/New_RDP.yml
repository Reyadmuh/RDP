name: Check Linux Runner for Windows QEMU VM

on:
  workflow_dispatch:

jobs:
  check-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspect Runner Resources
        shell: bash
        run: |
          set -euo pipefail

          echo "========== OS =========="
          cat /etc/os-release
          echo

          echo "========== CPU =========="
          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket|Hypervisor vendor|Virtualization)' || true
          echo "Logical CPUs available: $(nproc)"
          echo

          echo "========== MEMORY =========="
          free -h
          awk '/MemTotal/ {printf "Total RAM: %.2f GiB\n", $2/1024/1024}' /proc/meminfo
          echo

          echo "========== DISK =========="
          df -h /
          echo

          echo "========== KVM =========="
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            if command -v kvm-ok >/dev/null 2>&1; then kvm-ok || true; fi
          else
            echo "/dev/kvm is not available; QEMU may have to use software emulation."
          fi
          echo

      - name: Install QEMU and Inspect Capabilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          echo "========== QEMU VERSION =========="
          qemu-system-x86_64 --version
          echo
          echo "========== QEMU ACCELERATORS =========="
          qemu-system-x86_64 -accel help || true
          echo

      - name: Check Whether 8 vCPU and 32 GiB RAM Are Feasible
        shell: bash
        run: |
          set -euo pipefail
          CPUS=$(nproc)
          MEM_KB=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
          MEM_GIB=$(awk -v kb="$MEM_KB" 'BEGIN {printf "%.2f", kb/1024/1024}')

          echo "Available logical CPUs: $CPUS"
          echo "Currently available memory: ${MEM_GIB} GiB"

          if [ "$CPUS" -lt 8 ]; then
            echo "RESULT: Host exposes fewer than 8 logical CPUs; 8-vCPU VM cannot be guaranteed."
          else
            echo "CPU CHECK: Host exposes at least 8 logical CPUs."
          fi

          if awk -v kb="$MEM_KB" 'BEGIN {exit !(kb >= 32*1024*1024)}'; then
            echo "RAM CHECK: At least 32 GiB is currently available."
          else
            echo "RESULT: Less than 32 GiB RAM is available now; do not allocate 32 GiB to the VM on this host."
          fi

          echo "This is a capability check only; it does not create or boot a Windows VM."
