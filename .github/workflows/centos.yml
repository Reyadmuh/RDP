name: CentOS 9 QEMU Lab

on:
  workflow_dispatch:

jobs:
  centos-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. Install QEMU and Required Tools
      # =========================================================

      - name: Install QEMU and Required Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            sshpass \
            netcat-openbsd \
            curl \
            wget

          echo "======================================"
          echo "QEMU VERSION"
          echo "======================================"

          qemu-system-x86_64 --version
          qemu-img --version


      # =========================================================
      # 2. Check KVM
      # =========================================================

      - name: Check KVM
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING KVM"
          echo "======================================"

          if [ -e /dev/kvm ]; then
            echo "KVM is available."
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is NOT available."
            echo "QEMU will use software emulation."
          fi


      # =========================================================
      # 3. Prepare CentOS Directory
      # =========================================================

      - name: Prepare CentOS Directory
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/centos"

          echo "======================================"
          echo "CENTOS DIRECTORY"
          echo "======================================"

          ls -la "$HOME/centos"


      # =========================================================
      # 4. Download CentOS Stream 9
      # =========================================================

      - name: Download CentOS Stream 9
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "DOWNLOADING CENTOS STREAM 9"
          echo "======================================"

          URL="https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-20260922.0.x86_64.qcow2"

          echo "CentOS URL:"
          echo "$URL"

          rm -f centos.qcow2

          curl -4 \
            -fL \
            --retry 15 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            -o centos.qcow2 \
            "$URL"

          echo "======================================"
          echo "DOWNLOAD COMPLETED"
          echo "======================================"

          ls -lh centos.qcow2

          echo "======================================"
          echo "IMAGE INFORMATION"
          echo "======================================"

          qemu-img info centos.qcow2
