name: CentOS 9 QEMU Lab

on:
  workflow_dispatch:

jobs:
  centos-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. Install QEMU and Required Tools
      # =========================================================

      - name: Install QEMU and Required Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            sshpass \
            netcat-openbsd \
            curl \
            wget

          echo "======================================"
          echo "QEMU VERSION"
          echo "======================================"

          qemu-system-x86_64 --version
          qemu-img --version


      # =========================================================
      # 2. Check KVM
      # =========================================================

      - name: Check KVM
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING KVM"
          echo "======================================"

          if [ -e /dev/kvm ]; then
            echo "KVM is available."
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is NOT available."
            echo "QEMU will use software emulation."
          fi


      # =========================================================
      # 3. Prepare CentOS Directory
      # =========================================================

      - name: Prepare CentOS Directory
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/centos"

          echo "======================================"
          echo "CENTOS DIRECTORY"
          echo "======================================"

          ls -la "$HOME/centos"


      # =========================================================
      # 4. Generate Temporary SSH Key
      # =========================================================

      - name: Generate Temporary SSH Key
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GENERATING SSH KEY"
          echo "======================================"

          SSH_DIR="$HOME/centos/ssh"

          mkdir -p "$SSH_DIR"

          chmod 700 "$SSH_DIR"

          rm -f "$SSH_DIR/id_ed25519"
          rm -f "$SSH_DIR/id_ed25519.pub"

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f "$SSH_DIR/id_ed25519" \
            -C "github-centos-${GITHUB_RUN_ID}"

          chmod 600 "$SSH_DIR/id_ed25519"
          chmod 644 "$SSH_DIR/id_ed25519.pub"

          echo "SSH public key:"
          cat "$SSH_DIR/id_ed25519.pub"

          echo "======================================"
          echo "SSH KEY CREATED"
          echo "======================================"


      # =========================================================
      # 5. Download CentOS Stream 9
      # =========================================================

      - name: Download CentOS Stream 9
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "DOWNLOADING CENTOS STREAM 9"
          echo "======================================"

          URL="https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-20260922.0.x86_64.qcow2"

          echo "CentOS URL:"
          echo "$URL"

          rm -f centos.qcow2

          curl -4 \
            -fL \
            --retry 15 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            -o centos.qcow2 \
            "$URL"

          echo "======================================"
          echo "DOWNLOAD COMPLETED"
          echo "======================================"

          ls -lh centos.qcow2

          echo "======================================"
          echo "IMAGE INFORMATION"
          echo "======================================"

          qemu-img info centos.qcow2


      # =========================================================
      # 6. Validate CentOS Image
      # =========================================================

      - name: Validate CentOS Image
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "VALIDATING CENTOS IMAGE"
          echo "======================================"

          if [ ! -f centos.qcow2 ]; then
            echo "ERROR: centos.qcow2 does not exist."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s centos.qcow2)

          echo "Image size:"
          echo "$FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 500000000 ]; then
            echo "ERROR: CentOS image is too small."
            file centos.qcow2
            exit 1
          fi

          qemu-img check centos.qcow2

          echo "CentOS image validation successful."


      # =========================================================
      # 7. Resize Disk to 40 GB
      # =========================================================

      - name: Create 40 GB Disk
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "RESIZING DISK TO 40 GB"
          echo "======================================"

          qemu-img resize centos.qcow2 40G

          echo "======================================"
          echo "DISK INFORMATION"
          echo "======================================"

          qemu-img info centos.qcow2


      # =========================================================
      # 8. Create Cloud-Init
      # =========================================================

      - name: Create Cloud Init
        shell: bash
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          SEED_DIR="$HOME/centos/seed"
          SSH_DIR="$HOME/centos/ssh"

          mkdir -p "$SEED_DIR"

          echo "======================================"
          echo "CREATING CLOUD-INIT"
          echo "======================================"

          if [ -z "$TS_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is empty."
            echo
            echo "Create GitHub Secret:"
            echo "TAILSCALE_AUTH_KEY"
            exit 1
          fi

          if [ ! -f "$SSH_DIR/id_ed25519.pub" ]; then
            echo "ERROR: SSH public key does not exist."
            exit 1
          fi

          SSH_PUBLIC_KEY=$(cat "$SSH_DIR/id_ed25519.pub")

          TS_AUTH_KEY_B64=$(printf '%s' "$TS_AUTH_KEY" | base64 -w 0)

          SSH_PUBLIC_KEY_B64=$(printf '%s' "$SSH_PUBLIC_KEY" | base64 -w 0)

          cat > "$SEED_DIR/user-data" <<'CLOUDINIT'
          #cloud-config

          hostname: centos9-lab

          manage_etc_hosts: true

          ssh_pwauth: true

          disable_root: false

          ssh_deletekeys: false

          users:

            - default

            - name: devops
              gecos: DevOps User
              groups:
                - wheel
              sudo:
                - ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: false
              ssh_authorized_keys:
                - __SSH_PUBLIC_KEY__

          chpasswd:
            list: |
              root:123456
              devops:123456
            expire: false

          package_update: true

          packages:
            - openssh-server
            - curl
            - wget
            - vim
            - git
            - tar
            - gzip
            - unzip
            - net-tools
            - bind-utils
            - iproute
            - procps-ng

          write_files:

            - path: /root/setup-tailscale.sh
              permissions: '0700'
              owner: root:root

              content: |
                #!/bin/bash

                set -e

                echo "======================================"
                echo "INSTALLING TAILSCALE"
                echo "======================================"

                curl -4 -fsSL https://tailscale.com/install.sh | sh

                systemctl enable --now tailscaled

                sleep 5

                TS_AUTH_KEY=$(printf '%s' '__TS_AUTH_KEY_B64__' | base64 -d)

                if [ -z "$TS_AUTH_KEY" ]; then
                  echo "ERROR: Tailscale authentication key is empty."
                  exit 1
                fi

                echo "Connecting to Tailscale..."

                tailscale up \
                  --auth-key="$TS_AUTH_KEY" \
                  --hostname="centos9-gh-__RUN_ID__" \
                  --ssh=false

                echo "Tailscale connected."

                tailscale status > /root/tailscale-status.txt || true

                tailscale ip -4 > /root/tailscale-ip.txt || true

                chmod 600 /root/tailscale-status.txt
                chmod 600 /root/tailscale-ip.txt

                unset TS_AUTH_KEY

          runcmd:

            - systemctl enable sshd

            - systemctl start sshd

            - echo 'root:123456' | chpasswd

            - echo 'devops:123456' | chpasswd

            - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

            - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config

            - systemctl restart sshd

            - /root/setup-tailscale.sh

            - echo "CentOS Stream 9 QEMU Lab" > /root/vm-info.txt
            - echo "Hostname: centos9-lab" >> /root/vm-info.txt
            - echo "CPU: 2" >> /root/vm-info.txt
            - echo "RAM: 4 GB" >> /root/vm-info.txt
            - echo "Disk: 40 GB" >> /root/vm-info.txt
            - echo "SSH: Enabled" >> /root/vm-info.txt
            - echo "Tailscale: Enabled" >> /root/vm-info.txt

          final_message: "CentOS Stream 9 is ready."
          CLOUDINIT

          sed -i "s|__SSH_PUBLIC_KEY__|$SSH_PUBLIC_KEY|g" \
            "$SEED_DIR/user-data"

          sed -i "s|__TS_AUTH_KEY_B64__|$TS_AUTH_KEY_B64|g" \
            "$SEED_DIR/user-data"

          sed -i "s|__RUN_ID__|$RUN_ID|g" \
            "$SEED_DIR/user-data"

          cat > "$SEED_DIR/meta-data" <<EOF
          instance-id: centos9-gh-${RUN_ID}
          local-hostname: centos9-lab
          EOF

          echo "======================================"
          echo "CLOUD-INIT CREATED"
          echo "======================================"

          ls -lh "$SEED_DIR"


      # =========================================================
      # 9. Validate Cloud-Init
      # =========================================================

      - name: Validate Cloud Init
        shell: bash
        run: |
          set -e

          SEED_DIR="$HOME/centos/seed"

          echo "======================================"
          echo "VALIDATING CLOUD-INIT"
          echo "======================================"

          test -f "$SEED_DIR/user-data"
          test -f "$SEED_DIR/meta-data"

          if grep -q '__SSH_PUBLIC_KEY__' "$SEED_DIR/user-data"; then
            echo "ERROR: SSH key placeholder was not replaced."
            exit 1
          fi

          if grep -q '__TS_AUTH_KEY_B64__' "$SEED_DIR/user-data"; then
            echo "ERROR: Tailscale placeholder was not replaced."
            exit 1
          fi

          if grep -q '__RUN_ID__' "$SEED_DIR/user-data"; then
            echo "ERROR: RUN_ID placeholder was not replaced."
            exit 1
          fi

          echo "Cloud-init validation successful."


      # =========================================================
      # 10. Create Cloud-Init ISO
      # =========================================================

      - name: Create Cloud Init ISO
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "CREATING CLOUD-INIT ISO"
          echo "======================================"

          rm -f seed.iso

          cloud-localds \
            seed.iso \
            seed/user-data \
            seed/meta-data

          echo "======================================"
          echo "SEED ISO CREATED"
          echo "======================================"

          ls -lh seed.iso


      # =========================================================
      # 11. Start CentOS VM
      # =========================================================

      - name: Start CentOS VM
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "STARTING CENTOS VM"
          echo "======================================"

          PID_FILE="/tmp/centos-qemu-${GITHUB_RUN_ID}.pid"

          rm -f "$PID_FILE"

          if [ -e /dev/kvm ]; then

            echo "KVM detected."
            echo "Starting QEMU with hardware acceleration."

            sudo qemu-system-x86_64 \
              -enable-kvm \
              -machine q35 \
              -cpu host \
              -smp 2 \
              -m 4096 \
              -drive file=centos.qcow2,if=virtio,format=qcow2 \
              -drive file=seed.iso,media=cdrom,readonly=on \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -display none \
              -daemonize \
              -pidfile "$PID_FILE"

          else

            echo "KVM not detected."
            echo "Starting QEMU with software emulation."

            qemu-system-x86_64 \
              -machine q35 \
              -cpu max \
              -smp 2 \
              -m 4096 \
              -drive file=centos.qcow2,if=virtio,format=qcow2 \
              -drive file=seed.iso,media=cdrom,readonly=on \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -display none \
              -daemonize \
              -pidfile "$PID_FILE"

          fi

          sleep 10

          echo "======================================"
          echo "
