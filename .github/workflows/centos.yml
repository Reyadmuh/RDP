name: CentOS 9 QEMU Lab

on:
  workflow_dispatch:

jobs:
  centos-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. Install QEMU and Required Tools
      # =========================================================

      - name: Install QEMU and Required Tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            netcat-openbsd \
            curl \
            wget

          echo "======================================"
          echo "QEMU VERSION"
          echo "======================================"

          qemu-system-x86_64 --version
          qemu-img --version


      # =========================================================
      # 2. Check KVM
      # =========================================================

      - name: Check KVM
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING KVM"
          echo "======================================"

          if [ -e /dev/kvm ]; then
            echo "KVM is available."
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is NOT available."
            echo "QEMU will use software emulation."
          fi


      # =========================================================
      # 3. Prepare CentOS Directory
      # =========================================================

      - name: Prepare CentOS Directory
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/centos/ssh"

          chmod 700 "$HOME/centos/ssh"

          echo "CentOS directory prepared."


      # =========================================================
      # 4. Generate Temporary SSH Key
      # =========================================================

      - name: Generate Temporary SSH Key
        shell: bash
        run: |
          set -e

          SSH_DIR="$HOME/centos/ssh"

          rm -f "$SSH_DIR/id_ed25519"
          rm -f "$SSH_DIR/id_ed25519.pub"

          ssh-keygen -q \
            -t ed25519 \
            -N "" \
            -f "$SSH_DIR/id_ed25519" \
            -C "github-centos-${GITHUB_RUN_ID}"

          chmod 600 "$SSH_DIR/id_ed25519"
          chmod 644 "$SSH_DIR/id_ed25519.pub"

          echo "SSH key created successfully."


      # =========================================================
      # 5. Download CentOS Stream 9
      # =========================================================

      - name: Download CentOS Stream 9
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          URL="https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-20260922.0.x86_64.qcow2"

          echo "======================================"
          echo "DOWNLOADING CENTOS STREAM 9"
          echo "======================================"

          echo "URL:"
          echo "$URL"

          rm -f centos.qcow2

          curl -4 -fL \
            --retry 15 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            -o centos.qcow2 \
            "$URL"

          echo "======================================"
          echo "DOWNLOAD COMPLETED"
          echo "======================================"

          ls -lh centos.qcow2

          qemu-img info centos.qcow2


      # =========================================================
      # 6. Validate CentOS Image
      # =========================================================

      - name: Validate CentOS Image
        shell: bash
        run: |
          set -e

          IMAGE="$HOME/centos/centos.qcow2"

          echo "======================================"
          echo "VALIDATING CENTOS IMAGE"
          echo "======================================"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: CentOS image does not exist."
            exit 1
          fi

          SIZE=$(stat -c%s "$IMAGE")

          echo "Image size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 500000000 ]; then
            echo "ERROR: CentOS image is too small."
            exit 1
          fi

          qemu-img check "$IMAGE"

          echo "CentOS image validation successful."


      # =========================================================
      # 7. Resize Disk to 40 GB
      # =========================================================

      - name: Create 40 GB Disk
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "RESIZING DISK TO 40 GB"
          echo "======================================"

          qemu-img resize centos.qcow2 40G

          echo "======================================"
          echo "DISK INFORMATION"
          echo "======================================"

          qemu-img info centos.qcow2


      # =========================================================
      # 8. Create Cloud-Init
      # =========================================================

      - name: Create Cloud Init
        shell: bash
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          SEED_DIR="$HOME/centos/seed"
          SSH_DIR="$HOME/centos/ssh"

          mkdir -p "$SEED_DIR"

          echo "======================================"
          echo "CREATING CLOUD-INIT"
          echo "======================================"

          if [ -z "$TS_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is empty."
            exit 1
          fi

          if [ ! -f "$SSH_DIR/id_ed25519.pub" ]; then
            echo "ERROR: SSH public key does not exist."
            exit 1
          fi

          SSH_PUBLIC_KEY=$(cat "$SSH_DIR/id_ed25519.pub")

          TS_AUTH_KEY_B64=$(printf '%s' "$TS_AUTH_KEY" | base64 -w 0)

          cat > "$SEED_DIR/user-data" <<'CLOUDINIT'
          #cloud-config

          hostname: centos9-lab

          manage_etc_hosts: true

          ssh_pwauth: true

          disable_root: false

          users:

            - default

            - name: devops
              gecos: DevOps User
              groups:
                - wheel
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: false
              ssh_authorized_keys:
                - __SSH_PUBLIC_KEY__

          chpasswd:
            list: |
              root:123456
              devops:123456
            expire: false

          package_update: true

          packages:
            - openssh-server
            - curl
            - wget
            - vim
            - git
            - tar
            - gzip
            - unzip
            - net-tools
            - bind-utils
            - iproute
            - procps-ng

          write_files:

            - path: /root/setup-tailscale.sh
              permissions: '0700'
              owner: root:root

              content: |
                #!/bin/bash

                set -e

                echo "======================================"
                echo "INSTALLING TAILSCALE"
                echo "======================================"

                curl -4 -fsSL https://tailscale.com/install.sh | sh

                systemctl enable --now tailscaled

                sleep 5

                TS_AUTH_KEY=$(printf '%s' '__TS_AUTH_KEY_B64__' | base64 -d)

                if [ -z "$TS_AUTH_KEY" ]; then
                  echo "ERROR: Empty Tailscale auth key."
                  exit 1
                fi

                echo "Connecting to Tailscale..."

                tailscale up \
                  --auth-key="$TS_AUTH_KEY" \
                  --hostname="centos9-gh-__RUN_ID__" \
                  --ssh=false

                echo "Tailscale connected."

                tailscale status > /root/tailscale-status.txt || true

                tailscale ip -4 > /root/tailscale-ip.txt || true

                chmod 600 /root/tailscale-status.txt

                chmod 600 /root/tailscale-ip.txt

                unset TS_AUTH_KEY

          runcmd:

            - systemctl enable sshd

            - systemctl start sshd

            - echo 'root:123456' | chpasswd

            - echo 'devops:123456' | chpasswd

            - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

            - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config

            - systemctl restart sshd

            - /root/setup-tailscale.sh

            - echo 'CentOS Stream 9 QEMU Lab' > /root/vm-info.txt

            - echo 'Hostname: centos9-lab' >> /root/vm-info.txt

            - echo 'CPU: 2' >> /root/vm-info.txt

            - echo 'RAM: 4 GB' >> /root/vm-info.txt

            - echo 'Disk: 40 GB' >> /root/vm-info.txt

            - echo 'SSH: Enabled' >> /root/vm-info.txt

            - echo 'Tailscale: Enabled' >> /root/vm-info.txt

          final_message: "CentOS Stream 9 is ready."
          CLOUDINIT

          sed -i "s|__SSH_PUBLIC_KEY__|$SSH_PUBLIC_KEY|g" \
            "$SEED_DIR/user-data"

          sed -i "s|__TS_AUTH_KEY_B64__|$TS_AUTH_KEY_B64|g" \
            "$SEED_DIR/user-data"

          sed -i "s|__RUN_ID__|$RUN_ID|g" \
            "$SEED_DIR/user-data"

          cat > "$SEED_DIR/meta-data" <<EOF
          instance-id: centos9-gh-${RUN_ID}
          local-hostname: centos9-lab
          EOF

          echo "Cloud-init files created successfully."


      # =========================================================
      # 9. Validate Cloud-Init
      # =========================================================

      - name: Validate Cloud Init
        shell: bash
        run: |
          set -e

          USER_DATA="$HOME/centos/seed/user-data"
          META_DATA="$HOME/centos/seed/meta-data"

          echo "======================================"
          echo "VALIDATING CLOUD-INIT"
          echo "======================================"

          test -f "$USER_DATA"
          test -f "$META_DATA"

          if grep -q '__SSH_PUBLIC_KEY__' "$USER_DATA"; then
            echo "ERROR: SSH placeholder was not replaced."
            exit 1
          fi

          if grep -q '__TS_AUTH_KEY_B64__' "$USER_DATA"; then
            echo "ERROR: Tailscale placeholder was not replaced."
            exit 1
          fi

          if grep -q '__RUN_ID__' "$USER_DATA"; then
            echo "ERROR: RUN_ID placeholder was not replaced."
            exit 1
          fi

          echo "Cloud-init validation successful."


      # =========================================================
      # 10. Create Cloud-Init ISO
      # =========================================================

      - name: Create Cloud Init ISO
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          echo "======================================"
          echo "CREATING CLOUD-INIT ISO"
          echo "======================================"

          rm -f seed.iso

          cloud-localds \
            seed.iso \
            seed/user-data \
            seed/meta-data

          echo "======================================"
          echo "SEED ISO CREATED"
          echo "======================================"

          ls -lh seed.iso


      # =========================================================
      # 11. Start CentOS VM
      # =========================================================

      - name: Start CentOS VM
        shell: bash
        run: |
          set -e

          cd "$HOME/centos"

          PID_FILE="/tmp/centos-qemu-${GITHUB_RUN_ID}.pid"

          rm -f "$PID_FILE"

          echo "======================================"
          echo "STARTING CENTOS VM"
          echo "======================================"

          if [ -e /dev/kvm ]; then

            echo "KVM detected."
            echo "Starting QEMU with hardware acceleration."

            sudo qemu-system-x86_64 \
              -enable-kvm \
              -machine q35 \
              -cpu host \
              -smp 2 \
              -m 4096 \
              -drive file=centos.qcow2,if=virtio,format=qcow2 \
              -drive file=seed.iso,media=cdrom,readonly=on \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -display none \
              -daemonize \
              -pidfile "$PID_FILE"

          else

            echo "KVM not detected."
            echo "Starting QEMU with software emulation."

            qemu-system-x86_64 \
              -machine q35 \
              -cpu max \
              -smp 2 \
              -m 4096 \
              -drive file=centos.qcow2,if=virtio,format=qcow2 \
              -drive file=seed.iso,media=cdrom,readonly=on \
              -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              -display none \
              -daemonize \
              -pidfile "$PID_FILE"

          fi

          sleep 5

          if [ ! -f "$PID_FILE" ]; then
            echo "ERROR: QEMU PID file was not created."
            ps aux | grep '[q]emu-system-x86_64' || true
            exit 1
          fi

          QEMU_PID=$(sudo cat "$PID_FILE")

          echo "QEMU PID: $QEMU_PID"

          echo "CENTOS_QEMU_PID=$QEMU_PID" >> "$GITHUB_ENV"

          ps aux | grep '[q]emu-system-x86_64' || true


      # =========================================================
      # 12. Wait for SSH Port
      # =========================================================

      - name: Wait for CentOS SSH
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WAITING FOR CENTOS SSH"
          echo "======================================"

          SSH_READY=0

          for i in $(seq 1 90); do

            if nc -z 127.0.0.1 2222 2>/dev/null; then

              echo "SSH port is ready."

              SSH_READY=1

              break

            fi

            echo "Waiting for SSH... $i/90"

            if ! sudo kill -0 "$CENTOS_QEMU_PID" 2>/dev/null; then

              echo "ERROR: QEMU stopped unexpectedly."

              ps aux | grep '[q]emu-system-x86_64' || true

              exit 1

            fi

            sleep 5

          done

          if [ "$SSH_READY" -ne 1 ]; then
            echo "ERROR: SSH port did not become available."
            exit 1
          fi


      # =========================================================
      # 13. Wait for SSH Authentication
      # =========================================================

      - name: Wait for CentOS SSH Authentication
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          echo "======================================"
          echo "WAITING FOR SSH AUTHENTICATION"
          echo "======================================"

          SSH_READY=0

          for i in $(seq 1 90); do

            if ssh \
              -i "$SSH_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -p 2222 \
              devops@127.0.0.1 \
              echo SSH_AUTH_OK 2>/dev/null; then

              echo "SSH authentication is ready."

              SSH_READY=1

              break

            fi

            echo "Waiting for SSH authentication... $i/90"

            sleep 5

          done

          if [ "$SSH_READY" -ne 1 ]; then
            echo "ERROR: SSH authentication did not become available."
            exit 1
          fi


      # =========================================================
      # 14. Wait for Cloud-Init
      # =========================================================

      - name: Wait for Cloud Init
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          echo "======================================"
          echo "WAITING FOR CLOUD-INIT"
          echo "======================================"

          CLOUD_INIT_STATUS=""

          for i in $(seq 1 60); do

            CLOUD_INIT_STATUS=$(ssh \
              -i "$SSH_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -p 2222 \
              devops@127.0.0.1 \
              "sudo cloud-init status --long 2>/dev/null || true")

            echo "--------------------------------------"
            echo "Cloud-init attempt: $i/60"
            echo "$CLOUD_INIT_STATUS"
            echo "--------------------------------------"

            if echo "$CLOUD_INIT_STATUS" | grep -q "status: done"; then

              echo "======================================"
              echo "CLOUD-INIT COMPLETED"
              echo "======================================"

              break

            fi

            if echo "$CLOUD_INIT_STATUS" | grep -q "status: error"; then

              echo "======================================"
              echo "CLOUD-INIT REPORTED ERROR"
              echo "======================================"

              echo "Cloud-init status:"
              echo "$CLOUD_INIT_STATUS"

              echo
              echo "Cloud-init output log:"

              ssh \
                -i "$SSH_KEY" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -p 2222 \
                devops@127.0.0.1 \
                "sudo tail -150 /var/log/cloud-init-output.log || true"

              exit 1

            fi

            echo "Waiting for cloud-init..."

            sleep 10

          done

          if ! echo "$CLOUD_INIT_STATUS" | grep -q "status: done"; then

            echo "======================================"
            echo "ERROR: CLOUD-INIT DID NOT COMPLETE"
            echo "======================================"

            echo "Final status:"
            echo "$CLOUD_INIT_STATUS"

            echo
            echo "Cloud-init output log:"

            ssh \
              -i "$SSH_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p 2222 \
              devops@127.0.0.1 \
              "sudo tail -200 /var/log/cloud-init-output.log || true"

            exit 1

          fi


      # =========================================================
      # 15. Verify CentOS
      # =========================================================

      - name: Verify CentOS
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          echo "======================================"
          echo "CENTOS SYSTEM INFORMATION"
          echo "======================================"

          echo "Operating System:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            cat /etc/centos-release

          echo
          echo "Kernel:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            uname -a

          echo
          echo "CPU:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            nproc

          echo
          echo "Memory:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            free -h

          echo
          echo "Disk:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            df -h

          echo
          echo "SSH service:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            sudo systemctl is-active sshd


      # =========================================================
      # 16. Verify DevOps User
      # =========================================================

      - name: Verify DevOps User
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          echo "======================================"
          echo "VERIFYING DEVOPS USER"
          echo "======================================"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            id devops

          echo

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            groups devops

          echo

          echo "Testing sudo:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            sudo whoami


      # =========================================================
      # 17. Get CentOS Tailscale IP
      # =========================================================

      - name: Get CentOS Tailscale IP
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          TS_IP=""

          echo "======================================"
          echo "GETTING TAILSCALE IP"
          echo "======================================"

          for i in $(seq 1 60); do

            TS_IP=$(ssh \
              -i "$SSH_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p 2222 \
              devops@127.0.0.1 \
              "sudo tailscale ip -4 2>/dev/null || true")

            TS_IP=$(echo "$TS_IP" | head -n 1 | tr -d '[:space:]')

            if [ -n "$TS_IP" ]; then

              echo "======================================"
              echo "TAILSCALE IP FOUND"
              echo "======================================"

              echo "$TS_IP"

              echo "CENTOS_TS_IP=$TS_IP" >> "$GITHUB_ENV"

              break

            fi

            echo "Waiting for Tailscale... $i/60"

            sleep 5

          done

          if [ -z "$TS_IP" ]; then

            echo "ERROR: Tailscale IP was not found."

            echo "Tailscale status:"

            ssh \
              -i "$SSH_KEY" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p 2222 \
              devops@127.0.0.1 \
              sudo tailscale status || true

            exit 1

          fi


      # =========================================================
      # 18. Verify Tailscale
      # =========================================================

      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          SSH_KEY="$HOME/centos/ssh/id_ed25519"

          echo "======================================"
          echo "TAILSCALE INFORMATION"
          echo "======================================"

          echo "Tailscale IP:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            sudo tailscale ip -4

          echo
          echo "Tailscale status:"

          ssh \
            -i "$SSH_KEY" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            devops@127.0.0.1 \
            sudo tailscale status


      # =========================================================
      # 19. Show Connection Information
      # =========================================================

      - name: Show CentOS Information
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "       CENTOS STREAM 9 VM IS READY"
          echo "=================================================="
          echo

          echo "Tailscale IP:"
          echo "$CENTOS_TS_IP"

          echo

          echo "SSH as devops:"
          echo "ssh devops@$CENTOS_TS_IP"

          echo

          echo "DevOps password:"
          echo "123456"

          echo

          echo "Root password:"
          echo "123456"

          echo

          echo "CPU:"
          echo "2"

          echo

          echo "RAM:"
          echo "4 GB"

          echo

          echo "Disk:"
          echo "40 GB"

          echo

          echo "SSH:"
          echo "Enabled"

          echo

          echo "Tailscale:"
          echo "Enabled"

          echo

          echo "=================================================="


      # =========================================================
      # 20. Keep VM Alive
      # =========================================================

      - name: Keep CentOS Alive
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "KEEPING CENTOS VM ALIVE"
          echo "======================================"

          while true; do

            if sudo kill -0 "$CENTOS_QEMU_PID" 2>/dev/null; then

              echo "$(date) - QEMU RUNNING - PID $CENTOS_QEMU_PID"

            else

              echo "$(date) - QEMU STOPPED"

              exit 1

            fi

            sleep 300

          done
