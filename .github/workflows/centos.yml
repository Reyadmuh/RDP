name: CentOS 9 QEMU Lab

on:
  workflow_dispatch:

jobs:
  centos-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. Install required packages
      # =========================================================
      - name: Install QEMU and Required Tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            openssh-client \
            sshpass \
            netcat-openbsd \
            curl \
            wget

          echo "======================================"
          echo "QEMU VERSION"
          echo "======================================"

          qemu-system-x86_64 --version
          qemu-img --version

      # =========================================================
      # 2. Check KVM
      # =========================================================
      - name: Check KVM
        run: |
          echo "======================================"
          echo "CHECKING KVM"
          echo "======================================"

          if [ -e /dev/kvm ]; then
            echo "KVM is available."
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm is NOT available."
            echo "QEMU will use software emulation."
          fi

      # =========================================================
      # 3. Prepare directory
      # =========================================================
      - name: Prepare CentOS Directory
        run: |
          set -e

          mkdir -p "$HOME/centos"

          echo "CentOS directory:"
          ls -la "$HOME/centos"

      # =========================================================
      # 4. Download CentOS Stream 9
      # =========================================================
      - name: Download CentOS Stream 9
        run: |
          set -e

          cd "$HOME/centos"

          # Pinned official CentOS Stream 9 image.
          # Using a fixed version avoids depending on "latest".
          URL="https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-20260922.0.x86_64.qcow2"

          echo "======================================"
          echo "DOWNLOADING CENTOS STREAM 9"
          echo "======================================
